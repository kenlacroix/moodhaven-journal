# cargo-deny configuration for MoodHaven Journal (cargo-deny 0.19+)
# Docs: https://embarkstudios.github.io/cargo-deny/
# Migration from pre-0.16: https://github.com/EmbarkStudios/cargo-deny/pull/611
#
# In 0.19+: vulnerability = "deny", unlicensed = "deny", copyleft = "warn"
# are the implicit defaults and have been removed as explicit config keys.

[advisories]
# Ignore advisories for unmaintained GTK3/Tauri transitive deps and other
# unfixable transitive deps. No fix version exists for any of these.
ignore = [
  # GTK3 bindings (unmaintained; Tauri Linux WebView dependency)
  "RUSTSEC-2024-0413",  # atk
  "RUSTSEC-2024-0416",  # atk-sys
  "RUSTSEC-2024-0412",  # gdk
  "RUSTSEC-2024-0418",  # gdk-sys
  "RUSTSEC-2024-0411",  # gdkwayland-sys
  "RUSTSEC-2024-0417",  # gdkx11
  "RUSTSEC-2024-0414",  # gdkx11-sys
  "RUSTSEC-2024-0415",  # gtk
  "RUSTSEC-2024-0420",  # gtk-sys
  "RUSTSEC-2024-0419",  # gtk3-macros
  "RUSTSEC-2024-0429",  # glib
  # Other unmaintained transitive deps (no fix version available)
  "RUSTSEC-2024-0370",  # proc-macro-error (pulled in by Tauri macros)
  "RUSTSEC-2024-0384",  # instant (via keyring → secret-service → zbus v3)
  "RUSTSEC-2024-0388",  # derivative (via keyring → secret-service → zbus v3)
  "RUSTSEC-2025-0057",  # fxhash
  "RUSTSEC-2025-0081",  # unic-char-property
  "RUSTSEC-2025-0075",  # unic-char-range
  "RUSTSEC-2025-0080",  # unic-common
  "RUSTSEC-2025-0100",  # unic-ucd-ident
  "RUSTSEC-2025-0098",  # unic-ucd-version
  # Unsound transitive deps (no fix version available for our pinned versions)
  "RUSTSEC-2026-0190",  # anyhow 1.0.102 — fixed in 1.0.103; upgrade tracked in #253
  "RUSTSEC-2026-0221",  # event-listener 5.4.1 — !Send tags across threads
  # Transitive dep vulnerabilities — fix requires major version bump in upstream dep chain
  "RUSTSEC-2026-0194",  # quick-xml <0.41.0 — quadratic attr-name check; fix requires major bump
  "RUSTSEC-2026-0195",  # quick-xml <0.41.0 — unbounded NsReader allocation; fix requires major bump
  "RUSTSEC-2026-0235",  # rkyv 0.7.x — OOB read with Rc/Arc; fix requires 0.7→0.8 major bump
  # Transitive dep vulnerabilities — patch-level fix available; upgrade tracked separately
  "RUSTSEC-2026-0258",  # h2 <0.4.16 — unbounded empty DATA frames (DoS); reqwest transitive dep
  "RUSTSEC-2026-0285",  # rustls <0.23.45 — TLS 1.3 handshake boundary issue; reqwest transitive dep
]

[licenses]
# Allow these SPDX license identifiers; anything else is denied by default
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "CC0-1.0",
  "Zlib",
  "MPL-2.0",             # selectors (via kuchikiki → tauri-utils → Tauri)
  "CDLA-Permissive-2.0", # webpki-roots (via hyper-rustls → reqwest 0.12)
]

[bans]
# Warn on duplicate dependency versions (can hide subtle version mismatches)
multiple-versions = "warn"
# Explicitly deny crates known to be insecure or unsuitable
deny = []

[sources]
# Only allow crates from crates.io (no private registries or arbitrary git sources)
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
